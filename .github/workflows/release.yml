name: Release

on:
  push:
    branches: [master, main]

permissions:
  contents: write

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked release tooling
        run: npm ci

      - name: Create source release
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 --wrap=0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_header}"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
